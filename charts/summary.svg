oke-linecap="round"/><line x1="850.9" x2="850.9" y1="960.2" y2="933.7" stroke="#9aa3ad" stroke-width="10" stroke-linecap="round"/><line x1="894.5" x2="894.5" y1="914.6" y2="750.8" stroke="#9aa3ad" stroke-width="10" stroke-linecap="round"/><polyline points="130.0,1085.0 444.5,1046.6 580.0,1024.1 715.5,999.3 759.1,988.4 794.7,978.7 824.8,964.0 850.9,940.6 894.5,861.3" fill="none" stroke="#2a6fb0" stroke-width="5" stroke-dasharray=""/><circle cx="130.0" cy="1085.0" r="7" fill="#2a6fb0"/><circle cx="444.5" cy="1046.6" r="7" fill="#2a6fb0"/><circle cx="580.0" cy="1024.1" r="7" fill="#2a6fb0"/><circle cx="715.5" cy="999.3" r="7" fill="#2a6fb0"/><circle cx="759.1" cy="988.4" r="7" fill="#2a6fb0"/><circle cx="794.7" cy="978.7" r="7" fill="#2a6fb0"/><circle cx="824.8" cy="964.0" r="7" fill="#2a6fb0"/><circle cx="850.9" cy="940.6" r="7" fill="#2a6fb0"/><circle cx="894.5" cy="861.3" r="7" fill="#2a6fb0"/><text x="1030" y="634" font-size="22" fill="#d9822b" text-anchor="end" font-weight="bold">From 5 million up only two routers answered.</text><text x="1030" y="664" font-size="22" fill="#d9822b" text-anchor="end" font-weight="bold">Their best quote at 7.5 million was a loss above 20%.</text><text x="1030" y="694" font-size="22" fill="#d9822b" text-anchor="end" font-weight="normal">A limit of one transaction, not a market price.</text><text x="50" y="120" font-size="110" fill="#1c1c1c" text-anchor="start" font-weight="bold">33% or 40%</text><text x="50" y="190" font-size="34" fill="#1c1c1c" text-anchor="start" font-weight="normal">of the sUSDe withdrawn from the largest sUSDe lending</text><text x="50" y="234" font-size="34" fill="#1c1c1c" text-anchor="start" font-weight="normal">market on Morpho (Ethereum) was matched by an Ethena</text><text x="50" y="278" font-size="34" fill="#1c1c1c" text-anchor="start" font-weight="normal">unstake the receiving address started within three days.</text><text x="50" y="340" font-size="27" fill="#d9822b" text-anchor="start" font-weight="bold">Receivers sold 5% or 6% on a DEX or through CoW in the same three days.</text><text x="50" y="378" font-size="28" fill="#555555" text-anchor="start" font-weight="normal">Two counting rules. 392 million sUSDe withdrawn since January 2026.</text><text x="50" y="416" font-size="28" fill="#555555" text-anchor="start" font-weight="normal">Matched by address, not by coin.</text><text x="50" y="480" font-size="26" fill="#1c1c1c" text-anchor="start" font-weight="bold">Quoted cost of selling sUSDe for USDC in one transaction</text><text x="50" y="516" font-size="22" fill="#555555" text-anchor="start" font-weight="normal">Best quote of up to three public routers, 8 snapshots, 23 and 24 November 2026.</text><text x="50" y="548" font-size="22" fill="#555555" text-anchor="start" font-weight="normal">Against unstake value. Log scales. Dots are the median, bars the range.</text><text x="580" y="1250" font-size="22" fill="#555555" text-anchor="middle" font-weight="normal">Size of the sale, USD</text><text x="50" y="1310" font-size="22" fill="#555555" text-anchor="start" font-weight="normal">Quotes, not trades. Onchain data and the Morpho API.</text></svg>